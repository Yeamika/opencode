name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify SDK generated files are committed
        run: |
          cd ./packages/sdk/js
          bun run build
          cd ../../..
          git diff --exit-code -- packages/sdk/js/src/gen packages/sdk/js/src/v2/gen

      - name: Run typecheck
        run: bun typecheck

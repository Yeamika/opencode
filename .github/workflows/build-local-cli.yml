name: build-full-packages

on:
  workflow_dispatch:
  push:
    branches:
      - "pr/**"
  pull_request:
    branches:
      - local-yes

permissions:
  contents: read

jobs:
  build-rec:
    name: build-rec-${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            package: remote-executor-linux-x86_64
            cross: false
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            package: remote-executor-linux-aarch64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: remote-executor-windows-x86_64
            cross: false
    steps:
      - name: Checkout RemoteExecutor
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.REMOTE_EXECUTOR_REPOSITORY || 'Yeamika/RemoteExecutor' }}
          ref: ${{ vars.REMOTE_EXECUTOR_REF || 'main' }}
          token: ${{ secrets.REMOTE_EXECUTOR_TOKEN || github.token }}
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build with cargo
        if: ${{ !matrix.cross }}
        run: |
          cargo build --release --bin remote-caller-mcp --target ${{ matrix.target }}
          cargo build --release --manifest-path vendor/pty-t/Cargo.toml -p pty_t_client --bin ptyt --target ${{ matrix.target }} --target-dir target

      - name: Build with cross
        if: matrix.cross
        run: |
          cross build --release --bin remote-caller-mcp --target ${{ matrix.target }}
          cross build --release --manifest-path vendor/pty-t/Cargo.toml -p pty_t_client --bin ptyt --target ${{ matrix.target }} --target-dir target

      - name: Stage RemoteExecutor binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "rec/${{ matrix.package }}"
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/remote-caller-mcp${ext}" "rec/${{ matrix.package }}/"
          cp "target/${{ matrix.target }}/release/ptyt${ext}" "rec/${{ matrix.package }}/"

      - name: Upload RemoteExecutor artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: rec/${{ matrix.package }}
          if-no-files-found: error

  build-refs-opencode:
    name: build-refs-opencode-${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            package: refs-opencode-linux-x64-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            package: refs-opencode-linux-arm64-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: refs-opencode-windows-x64-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross tools
        if: runner.os == 'Linux' && contains(matrix.target, 'aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux cross linkers
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/refs-linkers"
          printf '%s\n' '#!/usr/bin/env bash' 'exec aarch64-linux-gnu-gcc "$@"' > "$RUNNER_TEMP/refs-linkers/aarch64-linux-gnu-linker"
          chmod +x "$RUNNER_TEMP/refs-linkers/aarch64-linux-gnu-linker"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$RUNNER_TEMP/refs-linkers/aarch64-linux-gnu-linker" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: packages/REFS-opencode
        run: bun install --ignore-scripts

      - name: Build native addon
        working-directory: packages/REFS-opencode
        shell: bash
        run: bunx napi build --platform --release --target ${{ matrix.target }}

      - name: Smoke test native addon
        if: >
          (runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu') ||
          (runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc') ||
          (runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin')
        working-directory: packages/REFS-opencode
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) addon="./refs-opencode.linux-x64-gnu.node" ;;
            x86_64-pc-windows-msvc) addon="./refs-opencode.win32-x64-msvc.node" ;;
            aarch64-apple-darwin) addon="./refs-opencode.darwin-arm64.node" ;;
            *) exit 0 ;;
          esac
          test -f "$addon"
          mkdir -p .smoke
          : > .smoke/smoke.db
          node - "$addon" <<'EOF'
          const path = require("path")
          const addon = require(path.resolve(process.argv[2]))
          const workdir = process.cwd()
          const dbPath = path.resolve(".smoke/smoke.db")
          const handle = addon.createSessionMcp(dbPath, "gha-smoke", workdir)
          const tools = JSON.parse(handle.listTools())
          if (!Array.isArray(tools?.result?.tools) || tools.result.tools.length === 0) {
            throw new Error("REFS-opencode smoke test returned no tools")
          }
          console.log(`REFS-opencode loaded ${tools.result.tools.length} tools`)
          EOF

      - name: Stage native addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "refs/${{ matrix.package }}"
          cp packages/REFS-opencode/refs-opencode.*.node "refs/${{ matrix.package }}/"

      - name: Upload REFS-opencode artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: refs/${{ matrix.package }}
          if-no-files-found: error

  build:
    needs:
      - build-rec
      - build-refs-opencode
    runs-on: ubuntu-24.04
    env:
      OPENCODE_CHANNEL: local-yes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-tags: true

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Generate local package version
        run: |
          VERSION="0.0.0-local-yes-$(date -u +'%y%m%d%H%M')"
          echo "LOCAL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LOCAL_VERSION=$VERSION"

      - name: Download RemoteExecutor artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: remote-executor-*
          path: packages/opencode/.remote-executor

      - name: Download REFS-opencode native addons
        uses: actions/download-artifact@v7
        with:
          pattern: refs-opencode-*
          path: packages/opencode/.refs-opencode

      - name: Build CLI targets
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ env.LOCAL_VERSION }}
          OPENCODE_REMOTE_EXECUTOR_DIST: ${{ github.workspace }}/packages/opencode/.remote-executor
          OPENCODE_REMOTE_EXECUTOR_REQUIRED: "0"
          OPENCODE_REFS_OPENCODE_DIST: ${{ github.workspace }}/packages/opencode/.refs-opencode
          OPENCODE_REFS_OPENCODE_REQUIRED: "1"
          OPENCODE_BUILD_TARGETS: linux-x64,linux-arm64,win32-x64

      - name: Smoke test packaged CLI assets
        shell: bash
        run: |
          set -euo pipefail
          test -x packages/opencode/dist/opencode-linux-x64/bin/opencode
          test -f packages/opencode/dist/opencode-linux-x64/bin/refs-opencode.linux-x64-gnu.node
          test -f packages/opencode/dist/opencode-windows-x64/bin/refs-opencode.win32-x64-msvc.node
          packages/opencode/dist/opencode-linux-x64/bin/opencode --version

      - name: Build SDK package
        run: |
          cd ./packages/sdk/js
          bun run build

      - name: Verify SDK generated files are committed
        run: git diff --exit-code -- packages/sdk/js/src/gen packages/sdk/js/src/v2/gen

      - name: Build plugin package
        run: |
          cd ./packages/plugin
          bun run build

      - name: Pack windows x64 npm package
        run: npm pack ./packages/opencode/dist/opencode-windows-x64

      - name: Pack linux arm64 npm package
        run: npm pack ./packages/opencode/dist/opencode-linux-arm64

      - name: Pack linux x64 npm package
        run: npm pack ./packages/opencode/dist/opencode-linux-x64

      - name: Prepare opencode-ai launcher package
        run: |
          mkdir -p ./packages/opencode/dist/opencode-ai
          cp -r ./packages/opencode/bin ./packages/opencode/dist/opencode-ai/bin
          cp ./packages/opencode/script/postinstall.mjs ./packages/opencode/dist/opencode-ai/postinstall.mjs
          cp ./LICENSE ./packages/opencode/dist/opencode-ai/LICENSE
          node <<'EOF'
          const fs = require("fs")
          const path = require("path")
          const root = path.resolve("./packages/opencode")
          const dist = path.join(root, "dist")
          const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"))
          const win = JSON.parse(fs.readFileSync(path.join(dist, "opencode-windows-x64", "package.json"), "utf8"))
          const linuxX64 = JSON.parse(fs.readFileSync(path.join(dist, "opencode-linux-x64", "package.json"), "utf8"))
          const linux = JSON.parse(fs.readFileSync(path.join(dist, "opencode-linux-arm64", "package.json"), "utf8"))
          fs.writeFileSync(
            path.join(dist, "opencode-ai", "package.json"),
            JSON.stringify(
              {
                name: "opencode-ai",
                version: win.version,
                license: pkg.license,
                bin: {
                  opencode: "./bin/opencode",
                },
                scripts: {
                  postinstall: "node ./postinstall.mjs",
                },
                optionalDependencies: {
                  [win.name]: win.version,
                  [linuxX64.name]: linuxX64.version,
                  [linux.name]: linux.version,
                },
              },
              null,
              2,
            ),
          )
          EOF

      - name: Pack opencode-ai launcher package
        run: npm pack ./packages/opencode/dist/opencode-ai

      - name: Pack SDK package
        run: |
          cp ./packages/sdk/js/package.json ./packages/sdk/js/package.json.bak
          node <<'EOF'
          const fs = require("fs")
          const path = require("path")
          const file = path.resolve("./packages/sdk/js/package.json")
           const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
           pkg.version = process.env.LOCAL_VERSION
           const map = (value) => {
            if (typeof value === "string") {
              const item = value.replace("./src/", "./dist/").replace(/\.ts$/, "")
              return { import: item + ".js", types: item + ".d.ts" }
            }
            if (!value || typeof value !== "object") return value
            return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, map(item)]))
          }
          pkg.exports = map(pkg.exports)
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2))
          EOF
          (cd ./packages/sdk/js && bun pm pack)
          tar -tf ./packages/sdk/js/opencode-ai-sdk-*.tgz | grep '^package/dist/'
          mv ./packages/sdk/js/package.json.bak ./packages/sdk/js/package.json

      - name: Pack plugin package
        run: |
          cp ./packages/plugin/package.json ./packages/plugin/package.json.bak
          node <<'EOF'
          const fs = require("fs")
          const path = require("path")
          const file = path.resolve("./packages/plugin/package.json")
           const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
           pkg.version = process.env.LOCAL_VERSION
           pkg.dependencies["@opencode-ai/sdk"] = pkg.version
          pkg.exports = Object.fromEntries(
            Object.entries(pkg.exports).map(([key, value]) => {
              const item = value.replace("./src/", "./dist/").replace(/\.ts$/, "")
              return [key, { import: item + ".js", types: item + ".d.ts" }]
            }),
          )
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2))
          EOF
          (cd ./packages/plugin && bun pm pack)
          tar -tf ./packages/plugin/opencode-ai-plugin-*.tgz | grep '^package/dist/'
          mv ./packages/plugin/package.json.bak ./packages/plugin/package.json

      - name: Write package manifest
        run: |
          node <<'EOF'
          const fs = require("fs")
          const path = require("path")
          const entries = [
            { kind: "cli", artifact: "opencode-cli", glob: /^opencode-ai-.*\.tgz$/ },
            { kind: "cli-binary", artifact: "opencode-windows-x64", glob: /^opencode-windows-x64-.*\.tgz$/ },
            { kind: "cli-binary", artifact: "opencode-linux-x64", glob: /^opencode-linux-x64-.*\.tgz$/ },
            { kind: "cli-binary", artifact: "opencode-linux-arm64", glob: /^opencode-linux-arm64-.*\.tgz$/ },
            { kind: "sdk", artifact: "opencode-sdk", glob: /^opencode-ai-sdk-.*\.tgz$/ },
            { kind: "pluginsdk", artifact: "opencode-plugin-sdk", glob: /^opencode-ai-plugin-.*\.tgz$/ },
          ]
          const root = process.cwd()
          const files = fs.readdirSync(root)
          const output = entries.map((item) => {
            const file = files.find((name) => item.glob.test(name))
              || fs.readdirSync(path.join(root, 'packages', 'sdk', 'js')).find((name) => item.glob.test(name))
              || fs.readdirSync(path.join(root, 'packages', 'plugin')).find((name) => item.glob.test(name))
            return {
              kind: item.kind,
              artifact: item.artifact,
              file: file || null,
            }
          })
          fs.writeFileSync('build-full-packages.json', JSON.stringify(output, null, 2))
          EOF

      - name: Upload windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-windows-x64
          path: opencode-windows-x64-*.tgz
          if-no-files-found: error

      - name: Upload linux arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-linux-arm64
          path: opencode-linux-arm64-*.tgz
          if-no-files-found: error

      - name: Upload linux x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-linux-x64
          path: opencode-linux-x64-*.tgz
          if-no-files-found: error

      - name: Upload opencode-ai launcher artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-cli
          path: opencode-ai-*.tgz
          if-no-files-found: error

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-sdk
          path: packages/sdk/js/opencode-ai-sdk-*.tgz
          if-no-files-found: error

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencode-plugin-sdk
          path: packages/plugin/opencode-ai-plugin-*.tgz
          if-no-files-found: error

      - name: Upload package manifest
        uses: actions/upload-artifact@v7
        with:
          name: build-full-packages-manifest
          path: build-full-packages.json
          if-no-files-found: error

  validate-packaged-cli:
    needs: build
    name: validate-${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package: linux-x64
            artifact: cli-binary-linux-x64
            executable: package/bin/opencode
            refsAddon: package/bin/refs-opencode.linux-x64-gnu.node
          - os: ubuntu-24.04-arm
            package: linux-arm64
            artifact: cli-binary-linux-arm64
            executable: package/bin/opencode
            refsAddon: package/bin/refs-opencode.linux-arm64-gnu.node
          - os: windows-latest
            package: windows-x64
            artifact: cli-binary-windows-x64
            executable: package/bin/opencode.exe
            refsAddon: package/bin/refs-opencode.win32-x64-msvc.node
    steps:
      - name: Download packaged CLI
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packaged-cli

      - name: Download launcher package
        uses: actions/download-artifact@v7
        with:
          name: opencode-cli
          path: packaged-launcher

      - name: Extract packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(find packaged-cli -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tgz"
          tar -xzf "$tgz"
          test -f "${{ matrix.executable }}"
          test -f "${{ matrix.refsAddon }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            test -x "${{ matrix.executable }}"
          fi

      - name: Install launcher package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p launcher-smoke
          cp packaged-cli/*.tgz launcher-smoke/
          cp packaged-launcher/*.tgz launcher-smoke/
          cd launcher-smoke
          npm init -y
          launcher_tgz="$(find . -maxdepth 1 -name 'opencode-ai-*.tgz' -print -quit)"
          binary_tgz="$(find . -maxdepth 1 -name 'opencode-*.tgz' ! -name 'opencode-ai-*.tgz' -print -quit)"
          test -n "$launcher_tgz"
          test -n "$binary_tgz"
          npm install --ignore-scripts "$launcher_tgz" "$binary_tgz"
          node ./node_modules/opencode-ai/bin/opencode --version

      - name: Start server and validate REFS startup
        shell: bash
        env:
          OPENCODE_EXE: ${{ matrix.executable }}
          OPENCODE_LAUNCHER_JS: launcher-smoke/node_modules/opencode-ai/bin/opencode
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("fs")
          const os = require("os")
          const path = require("path")
          const { spawn, spawnSync, execFileSync } = require("child_process")

          function fail(message, details = "") {
            throw new Error(`${message}${details ? `\n${details}` : ""}`)
          }

          function commandTarget(label, command, prefixArgs = []) {
            return { label, command: path.resolve(command), prefixArgs }
          }

          function runSync(target, args, options) {
            return execFileSync(target.command, [...target.prefixArgs, ...args], options)
          }

          function runAsync(target, args, options) {
            return spawn(target.command, [...target.prefixArgs, ...args], options)
          }

          async function waitForServer(server, url, serverOutput) {
            const deadline = Date.now() + 30_000
            while (Date.now() < deadline) {
              if (server.exitCode !== null) fail(`server exited before startup with code ${server.exitCode}`, serverOutput())
              try {
                const response = await fetch(`${url}/experimental/tool/ids`)
                if (response.ok) return await response.json()
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 500))
            }
            fail("server did not become ready", serverOutput())
          }

          function stopProcess(proc) {
            if (proc.exitCode !== null || proc.signalCode !== null) return
            if (process.platform === "win32" && proc.pid) {
              const out = spawnSync("taskkill", ["/pid", String(proc.pid), "/T", "/F"], { windowsHide: true })
              if (!out.error && out.status === 0) return
            }
            if (process.platform !== "win32" && proc.pid) {
              try {
                process.kill(-proc.pid, "SIGTERM")
                return
              } catch {}
            }
            proc.kill()
          }

          async function waitClosed(proc, timeoutMs = 2_000) {
            if (proc.exitCode !== null || proc.signalCode !== null) return
            await Promise.race([
              new Promise((resolve) => proc.once("close", resolve)),
              new Promise((resolve) => setTimeout(resolve, timeoutMs)),
            ])
            if (proc.exitCode === null && proc.signalCode === null) {
              if (process.platform !== "win32" && proc.pid) {
                try {
                  process.kill(-proc.pid, "SIGKILL")
                } catch {}
              } else {
                proc.kill("SIGKILL")
              }
            }
            proc.stdout?.destroy?.()
            proc.stderr?.destroy?.()
          }

          async function stopServer(server) {
            stopProcess(server)
            await waitClosed(server)
          }

          async function validateTarget(target) {
            const workdir = fs.mkdtempSync(path.join(os.tmpdir(), `opencode-${target.label}-workdir-`))
            const home = fs.mkdtempSync(path.join(os.tmpdir(), `opencode-${target.label}-home-`))
            const port = 19523 + Math.floor(Math.random() * 1000)
            const url = `http://127.0.0.1:${port}`
            const env = {
              ...process.env,
              HOME: home,
              USERPROFILE: home,
              XDG_CONFIG_HOME: path.join(home, ".config"),
              XDG_DATA_HOME: path.join(home, ".local", "share"),
              OPENCODE_DISABLE_EMBEDDED_WEB_UI: "1",
            }

            const version = runSync(target, ["--version"], { cwd: workdir, env, encoding: "utf8" }).trim()
            console.log(`${target.label} version: ${version}`)

            const server = runAsync(target, ["serve", "--hostname", "127.0.0.1", "--port", String(port)], {
              cwd: workdir,
              env,
              stdio: ["ignore", "pipe", "pipe"],
              detached: process.platform !== "win32",
            })
            let output = ""
            server.stdout.on("data", (chunk) => {
              output += chunk.toString()
              process.stdout.write(chunk)
            })
            server.stderr.on("data", (chunk) => {
              output += chunk.toString()
              process.stderr.write(chunk)
            })

            try {
              const ids = await waitForServer(server, url, () => output)
              for (const id of ["read", "FileAction", "rg", "exbash", "RemoteExecutorManager"]) {
                if (!ids.includes(id)) fail(`REFS tool id missing: ${id}`, JSON.stringify(ids))
              }
              console.log(`${target.label} tool ids include REFS tools: ${ids.filter((id) => ["read", "FileAction", "rg", "exbash", "RemoteExecutorManager"].includes(id)).join(", ")}`)

              const attach = runAsync(target, ["attach", url, "--dir", workdir], {
                cwd: workdir,
                env,
                stdio: ["ignore", "pipe", "pipe"],
                detached: process.platform !== "win32",
              })
              let attachOutput = ""
              attach.stdout.on("data", (chunk) => {
                attachOutput += chunk.toString()
              })
              attach.stderr.on("data", (chunk) => {
                attachOutput += chunk.toString()
              })

              await new Promise((resolve) => setTimeout(resolve, 5_000))
              if (/REFS-opencode native addon|not found next to the opencode binary|Cannot find module/i.test(attachOutput)) {
                fail("attach failed while loading packaged native dependencies", attachOutput)
              }
              if (attach.exitCode !== null && attach.exitCode !== 0) {
                fail(`attach exited early with code ${attach.exitCode}`, attachOutput)
              }
              if (attach.exitCode === null) {
                stopProcess(attach)
                await waitClosed(attach)
              }
              console.log(`${target.label} attach startup probe passed`)
            } finally {
              await stopServer(server)
            }
          }

          async function main() {
            const targets = [
              commandTarget("binary", process.env.OPENCODE_EXE),
              commandTarget("launcher", process.execPath, [path.resolve(process.env.OPENCODE_LAUNCHER_JS)]),
            ]
            for (const target of targets) {
              await validateTarget(target)
            }
          }

          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          EOF

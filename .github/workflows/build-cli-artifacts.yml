name: build-cli-artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - pr/reload-soft-workspace-clean

permissions:
  contents: read

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            artifact: opencode-cli
          - host: windows-latest
            artifact: opencode-cli-windows
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Remove tree-sitter-powershell on Windows
        if: runner.os == 'Windows'
        run: |
          rm -rf node_modules/tree-sitter-powershell node_modules/.bun/tree-sitter-powershell* || true

      - name: Build
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: 0.0.0-pr-reload-soft-workspace-clean
          OPENCODE_RELEASE: ""
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: ${{ matrix.settings.artifact }}
          path: |
            packages/opencode/dist/opencode-darwin*
            packages/opencode/dist/opencode-linux*

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.settings.artifact }}
          path: packages/opencode/dist/opencode-windows*
